# ============================================================
# mkdocs.yml — BUAA Hangzhou INSA Institute Self-Help Guide
# 北航中法未来科技学院（杭州）学习生活自助指南
# ============================================================

site_name: 北航中法未来科技学院自助指南
site_description: >
  北京航空航天大学中法未来科技学院（杭州）学习生活自助指南 —
  汇集课程学习资料、重难点解析与校园生活实用信息
site_author: Noct-BUAA
site_url: https://noct-buaa.github.io/Self-Help-Guide-of-BIFAST-BUAA/

repo_url: https://github.com/Noct-BUAA/Self-Help-Guide-of-BIFAST-BUAA
repo_name: Noct-BUAA/Self-Help-Guide-of-BIFAST-BUAA
edit_uri: edit/main/docs/

copyright: >
  Copyright &copy; 2026 Noct-BUAA

# ============================================================
# THEME
# ============================================================
theme:
  name: material
  language: zh

  # --- Palette (Light / Dark) ---
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换至暗色模式

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换至亮色模式

  # --- Fonts ---
  font:
    text: Noto Sans SC
    code: JetBrains Mono

  # --- Features ---
  features:
    - header.autohide          # 向下滚动时隐藏页眉
    - navigation.tabs          # 顶部标签页导航
    - navigation.tabs.sticky   # 标签页滚动时固定
    - navigation.sections      # 侧边栏分组标题
    - navigation.indexes       # 章节 index 页可直接点击

    - navigation.tracking      # URL hash 跟踪滚动位置
    - content.code.copy        # 代码块复制按钮
    - content.code.annotate    # 代码注释
    - search.suggest           # 搜索建议
    - search.highlight         # 搜索结果高亮
    - search.share             # 可分享的搜索结果链接

  # --- Icons ---
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left

  favicon: assets/images/favicon.svg
  logo: assets/images/buaa-emblem-blue.png

  custom_dir: overrides

