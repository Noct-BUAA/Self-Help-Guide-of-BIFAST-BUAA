            - 第二次作业: courses/year1/semester1/大学计算机基础/课程作业/第二次作业.md
            - 第三次作业: courses/year1/semester1/大学计算机基础/课程作业/第三次作业.md
            - 第四次作业: courses/year1/semester1/大学计算机基础/课程作业/第四次作业.md
            - 第五次作业: courses/year1/semester1/大学计算机基础/课程作业/第五次作业.md
            - 第六次作业: courses/year1/semester1/大学计算机基础/课程作业/第六次作业.md
