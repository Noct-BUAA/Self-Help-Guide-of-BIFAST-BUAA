      - 大二下学期:
        - 学期概览: courses/year2/semester2/index.md
        - 数学分析（3）: courses/year2/semester2/数学分析（3）/index.md
        - 几何: courses/year2/semester2/几何/index.md

  - 校园生活指南:
    - 生活指南概览: campus-life/index.md
    - 住宿: campus-life/housing.md
    - 餐饮: campus-life/dining.md
    - 交通出行: campus-life/transportation.md
    - 校园服务: campus-life/campus-services.md
    - 体育设施: campus-life/sports.md
    - 图书馆: campus-life/library.md
    - 生活便利: campus-life/daily-life.md
    - 常用信息: campus-life/contacts.md

  - 后记:
    - postscript/index.md

not_in_nav: |
  includes/*
  preface/*

# ============================================================
# MARKDOWN EXTENSIONS
# ============================================================
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: 页面目录

  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# ============================================================
# PLUGINS
# ============================================================
plugins:
  - search:
      lang:
        - zh
        - en
        - fr

# ============================================================
# EXTRA
# ============================================================
extra:
  generator: false

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - assets/javascripts/gsap.min.js
  - https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js
  - assets/javascripts/hero-scroll.js
  - assets/javascripts/extra.js
  - assets/javascripts/text-type.js
